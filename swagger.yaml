swagger: '2.0'
info:
  title: World Energy Consumption API
  description: API para obtener datos de consumo energético mundial
  version: '1.0'
host: energy-api.onrender.com
basePath: /
schemes:
  - https
produces:
  - application/json
paths:
  /energy:
    get:
      summary: GetWorldEnergyData
      operationId: GetWorldEnergyData
      parameters:
        - name: country
          in: query
          description: Filtrar por país (ej. 'Colombia', 'Spain', 'Germany')
          required: false
          type: string
        - name: year
          in: query
          description: Filtrar por año (ej. 2022, 2023)
          required: false
          type: integer
        - name: iso_code
          in: query
          description: Filtrar por código ISO (ej. 'COL', 'ESP', 'DEU')
          required: false
          type: string
        - name: limit
          in: query
          description: Número máximo de registros a retornar
          required: false
          type: integer
          default: 100
      responses:
        200:
          description: Respuesta exitosa
          schema:
            type: array
            items:
              type: object
              properties:
                # IDENTIFICACIÓN (TEXT)
                country:
                  type: string
                  description: País o región geográfica
                  example: "Colombia"
                iso_code:
                  type: string
                  description: Código ISO 3166-1 alpha-3
                  example: "COL"
                
                # TEMPORAL Y DEMOGRÁFICO (NUMERIC)
                year:
                  type: integer
                  description: Año de observación
                  example: 2022
                population:
                  type: number
                  description: Población total
                  example: 51874000
                gdp:
                  type: number
                  description: PIB en dólares internacionales (2011 prices)
                  example: 975840000000
                
                # ENERGÍA PRIMARIA (NUMERIC)
                primary_energy_consumption:
                  type: number
                  description: Consumo total de energía primaria en TWh
                  example: 1456.78
                energy_per_capita:
                  type: number
                  description: Consumo energético per cápita en kWh
                  example: 28095.5
                energy_per_gdp:
                  type: number
                  description: Energía por unidad de PIB en kWh/$
                  example: 1.49
                energy_cons_change_pct:
                  type: number
                  description: Cambio porcentual anual en consumo
                  example: 2.5
                energy_cons_change_twh:
                  type: number
                  description: Cambio absoluto anual en TWh
                  example: 35.6
                
                # CARBÓN (NUMERIC)
                coal_consumption:
                  type: number
                  description: Consumo de carbón en TWh
                  example: 156.89
                coal_production:
                  type: number
                  description: Producción de carbón en TWh
                  example: 245.32
                coal_electricity:
                  type: number
                  description: Electricidad generada con carbón en TWh
                  example: 89.45
                coal_cons_per_capita:
                  type: number
                  description: Consumo de carbón per cápita en kWh
                  example: 3025.4
                coal_share_energy:
                  type: number
                  description: Porcentaje de energía primaria del carbón
                  example: 10.77
                coal_share_elec:
                  type: number
                  description: Porcentaje de electricidad generada con carbón
                  example: 12.5
                coal_cons_change_pct:
                  type: number
                  description: Cambio porcentual anual en consumo de carbón
                  example: -5.2
                
                # GAS NATURAL (NUMERIC)
                gas_consumption:
                  type: number
                  description: Consumo de gas natural en TWh
                  example: 389.67
                gas_production:
                  type: number
                  description: Producción de gas en TWh
                  example: 156.23
                gas_electricity:
                  type: number
                  description: Electricidad generada con gas en TWh
                  example: 178.9
                gas_energy_per_capita:
                  type: number
                  description: Consumo de gas per cápita en kWh
                  example: 7512.8
                gas_share_energy:
                  type: number
                  description: Porcentaje de energía primaria del gas
                  example: 26.75
                gas_share_elec:
                  type: number
                  description: Porcentaje de electricidad generada con gas
                  example: 25.0
                
                # PETRÓLEO (NUMERIC)
                oil_consumption:
                  type: number
                  description: Consumo de petróleo en TWh
                  example: 567.34
                oil_production:
                  type: number
                  description: Producción de petróleo en TWh
                  example: 1245.67
                oil_electricity:
                  type: number
                  description: Electricidad generada con petróleo en TWh
                  example: 23.45
                oil_energy_per_capita:
                  type: number
                  description: Consumo de petróleo per cápita en kWh
                  example: 10938.2
                oil_share_energy:
                  type: number
                  description: Porcentaje de energía primaria del petróleo
                  example: 38.95
                oil_share_elec:
                  type: number
                  description: Porcentaje de electricidad generada con petróleo
                  example: 3.28
                
                # ENERGÍA SOLAR (NUMERIC)
                solar_consumption:
                  type: number
                  description: Consumo de energía solar en TWh
                  example: 12.34
                solar_electricity:
                  type: number
                  description: Electricidad generada con solar en TWh
                  example: 12.34
                solar_elec_per_capita:
                  type: number
                  description: Electricidad solar per cápita en kWh
                  example: 237.9
                solar_share_energy:
                  type: number
                  description: Porcentaje de energía primaria solar
                  example: 0.85
                solar_share_elec:
                  type: number
                  description: Porcentaje de electricidad generada con solar
                  example: 1.73
                solar_cons_change_pct:
                  type: number
                  description: Cambio porcentual anual en solar
                  example: 45.6
                
                # ENERGÍA EÓLICA (NUMERIC)
                wind_consumption:
                  type: number
                  description: Consumo de energía eólica en TWh
                  example: 8.92
                wind_electricity:
                  type: number
                  description: Electricidad generada con eólica en TWh
                  example: 8.92
                wind_elec_per_capita:
                  type: number
                  description: Electricidad eólica per cápita en kWh
                  example: 172.0
                wind_share_energy:
                  type: number
                  description: Porcentaje de energía primaria eólica
                  example: 0.61
                wind_share_elec:
                  type: number
                  description: Porcentaje de electricidad generada con eólica
                  example: 1.25
                
                # ENERGÍA HIDROELÉCTRICA (NUMERIC)
                hydro_consumption:
                  type: number
                  description: Consumo hidroeléctrico en TWh
                  example: 345.67
                hydro_electricity:
                  type: number
                  description: Electricidad hidroeléctrica en TWh
                  example: 345.67
                hydro_elec_per_capita:
                  type: number
                  description: Hidro per cápita en kWh
                  example: 6665.7
                hydro_share_energy:
                  type: number
                  description: Porcentaje de energía primaria hidroeléctrica
                  example: 23.73
                hydro_share_elec:
                  type: number
                  description: Porcentaje de electricidad hidroeléctrica
                  example: 48.38
                
                # ENERGÍA NUCLEAR (NUMERIC)
                nuclear_consumption:
                  type: number
                  description: Consumo nuclear en TWh
                  example: 0.0
                nuclear_electricity:
                  type: number
                  description: Electricidad nuclear en TWh
                  example: 0.0
                nuclear_elec_per_capita:
                  type: number
                  description: Nuclear per cápita en kWh
                  example: 0.0
                nuclear_share_energy:
                  type: number
                  description: Porcentaje de energía primaria nuclear
                  example: 0.0
                nuclear_share_elec:
                  type: number
                  description: Porcentaje de electricidad nuclear
                  example: 0.0
                
                # RENOVABLES TOTALES (NUMERIC)
                renewables_consumption:
                  type: number
                  description: Consumo total de renovables en TWh
                  example: 378.56
                renewables_electricity:
                  type: number
                  description: Electricidad de renovables en TWh
                  example: 378.56
                renewables_energy_per_capita:
                  type: number
                  description: Renovables per cápita en kWh
                  example: 7298.5
                renewables_share_energy:
                  type: number
                  description: Porcentaje de energía primaria renovable
                  example: 25.99
                renewables_share_elec:
                  type: number
                  description: Porcentaje de electricidad renovable
                  example: 52.99
                renewables_cons_change_pct:
                  type: number
                  description: Cambio porcentual anual en renovables
                  example: 8.3
                
                # FÓSILES TOTALES (NUMERIC)
                fossil_fuel_consumption:
                  type: number
                  description: Consumo total de fósiles en TWh
                  example: 1113.9
                fossil_electricity:
                  type: number
                  description: Electricidad de fósiles en TWh
                  example: 291.8
                fossil_energy_per_capita:
                  type: number
                  description: Fósiles per cápita en kWh
                  example: 21476.4
                fossil_share_energy:
                  type: number
                  description: Porcentaje de energía primaria fósil
                  example: 76.47
                fossil_share_elec:
                  type: number
                  description: Porcentaje de electricidad fósil
                  example: 40.84
                
                # BAJAS EN CARBONO (NUMERIC)
                low_carbon_consumption:
                  type: number
                  description: Consumo bajo carbono en TWh
                  example: 378.56
                low_carbon_electricity:
                  type: number
                  description: Electricidad baja en carbono en TWh
                  example: 378.56
                low_carbon_share_energy:
                  type: number
                  description: Porcentaje energía bajo carbono
                  example: 25.99
                low_carbon_share_elec:
                  type: number
                  description: Porcentaje electricidad baja en carbono
                  example: 52.99
                
                # ELECTRICIDAD GENERAL (NUMERIC)
                electricity_generation:
                  type: number
                  description: Generación total de electricidad en TWh
                  example: 714.24
                electricity_demand:
                  type: number
                  description: Demanda eléctrica en TWh
                  example: 714.24
                electricity_demand_per_capita:
                  type: number
                  description: Demanda per cápita en kWh
                  example: 13771.2
                per_capita_electricity:
                  type: number
                  description: Generación per cápita en kWh
                  example: 13771.2
                electricity_share_energy:
                  type: number
                  description: Porcentaje electricidad en energía primaria
                  example: 49.03
                
                # EMISIONES (NUMERIC)
                greenhouse_gas_emissions:
                  type: number
                  description: Emisiones GEI en Mt CO₂ equivalente
                  example: 168.45
                carbon_intensity_elec:
                  type: number
                  description: Intensidad de carbono en gCO₂/kWh
                  example: 235.8
                
                # IMPORTACIONES/EXPORTACIONES (NUMERIC)
                net_elec_imports:
                  type: number
                  description: Importaciones netas de electricidad en TWh
                  example: -12.34
                net_elec_imports_share_demand:
                  type: number
                  description: Porcentaje importaciones de la demanda
                  example: -1.73
                
                # BIOCOMBUSTIBLES (NUMERIC)
                biofuel_consumption:
                  type: number
                  description: Consumo de biocombustibles en TWh
                  example: 11.63
                biofuel_electricity:
                  type: number
                  description: Electricidad de biocombustibles en TWh
                  example: 5.82
                biofuel_share_energy:
                  type: number
                  description: Porcentaje biocombustibles en energía
                  example: 0.80
                biofuel_share_elec:
                  type: number
                  description: Porcentaje biocombustibles en electricidad
                  example: 0.81
                
                # OTRAS RENOVABLES (NUMERIC)
                other_renewable_consumption:
                  type: number
                  description: Otras renovables en TWh
                  example: 0.0
                other_renewable_electricity:
                  type: number
                  description: Electricidad otras renovables en TWh
                  example: 5.82
                other_renewables_share_energy:
                  type: number
                  description: Porcentaje otras renovables
                  example: 0.0
                
        400:
          description: Solicitud inválida
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Parámetros inválidos"
        
        500:
          description: Error interno del servidor
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Error al procesar la solicitud"

  /energy/countries:
    get:
      summary: GetAvailableCountries
      operationId: GetAvailableCountries
      description: Obtiene la lista de países disponibles en el dataset
      parameters: []
      responses:
        200:
          description: Lista de países disponibles
          schema:
            type: array
            items:
              type: object
              properties:
                country:
                  type: string
                  example: "Colombia"
                iso_code:
                  type: string
                  example: "COL"
                years_available:
                  type: integer
                  description: Número de años con datos disponibles
                  example: 58
                year_start:
                  type: integer
                  description: Primer año con datos
                  example: 1965
                year_end:
                  type: integer
                  description: Último año con datos
                  example: 2023

  /energy/statistics:
    get:
      summary: GetEnergyStatistics
      operationId: GetEnergyStatistics
      description: Obtiene estadísticas agregadas por país o región
      parameters:
        - name: country
          in: query
          description: País para el cual obtener estadísticas
          required: false
          type: string
        - name: year_start
          in: query
          description: Año de inicio del rango
          required: false
          type: integer
        - name: year_end
          in: query
          description: Año de fin del rango
          required: false
          type: integer
      responses:
        200:
          description: Estadísticas calculadas
          schema:
            type: object
            properties:
              country:
                type: string
              period:
                type: object
                properties:
                  start:
                    type: integer
                  end:
                    type: integer
              averages:
                type: object
                description: Promedios de métricas clave
              growth_rates:
                type: object
                description: Tasas de crecimiento anual
              latest_year_data:
                type: object
                description: Datos del año más reciente

definitions: {}
parameters: {}
responses: {}
securityDefinitions: {}
security: []
tags:
  - name: energy
    description: Operaciones relacionadas con datos energéticos
  - name: metadata
    description: Información sobre el dataset