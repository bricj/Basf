swagger: '2.0'
info:
  title: Energy Data API
  description: API para ejecutar consultas SQL sobre datos históricos de energía
  version: '1.0.0'
host: basf-1.onrender.com
basePath: /
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json

paths:
  /:
    get:
      summary: InformaciónServicio
      operationId: InformaciónServicio
      parameters: []
      responses:
        200:
          description: Respuesta exitosa
          schema:
            type: object
            properties:
              service:
                type: string
              version:
                type: string
              descripcion:
                type: string
              capacidades:
                type: array
                items:
                  type: string
              endpoints_principales:
                type: array
                items:
                  type: string

  /esquema-bd:
    get:
      summary: ObtenerEsquemaBD
      operationId: ObtenerEsquemaBD
      parameters: []
      responses:
        200:
          description: Respuesta exitosa
          schema:
            type: object
            properties:
              tablas:
                type: array
                items:
                  type: object
                  properties:
                    nombre:
                      type: string
                    descripcion:
                      type: string
              columnas:
                type: array
                items:
                  type: object
                  properties:
                    column_name:
                      type: string
                    data_type:
                      type: string
                    is_nullable:
                      type: string
                    column_default:
                      type: string
              ejemplos_valores:
                type: array
                items:
                  type: object
                  properties:
                    columna:
                      type: string
                    valores_ejemplo:
                      type: array
                      items:
                        type: string
              esquema_sugerido:
                type: string
        500:
          description: Error interno del servidor
          schema:
            type: object
            properties:
              detail:
                type: string

  /ejecutar-sql:
    post:
      summary: EjecutarSQL
      operationId: EjecutarSQL
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            required:
              - instruccion_sql
            properties:
              instruccion_sql:
                type: string
                description: Consulta SQL SELECT a ejecutar
                example: SELECT country, year, coal_consumption FROM energy_data WHERE year >= 2000 ORDER BY coal_consumption DESC LIMIT 10
              parametros:
                type: object
                description: Parámetros adicionales (opcional)
              contexto:
                type: string
                description: Contexto de la consulta (opcional)
                example: Análisis de consumo de carbón
      responses:
        200:
          description: Respuesta exitosa
          schema:
            type: object
            properties:
              status:
                type: string
                enum:
                  - exitoso
                  - sql_invalido
                  - timeout
                  - sin_resultados
                  - error_ejecucion
              mensaje:
                type: string
              error:
                type: string
              sugerencia:
                type: string
              contexto:
                type: string
              resumen:
                type: object
                properties:
                  total_registros:
                    type: integer
                  columnas_principales:
                    type: array
                    items:
                      type: string
                  muestra_datos:
                    type: array
                    items:
                      type: object
                  estadisticas:
                    type: object
              datos:
                type: array
                items:
                  type: object
                  properties:
                    country:
                      type: string
                    year:
                      type: integer
                    iso_code:
                      type: string
                    population:
                      type: number
                    gdp:
                      type: number
                    coal_cons_change_pct:
                      type: number
                    coal_cons_change_twh:
                      type: number
                    coal_cons_per_capita:
                      type: number
                    coal_consumption:
                      type: number
                    coal_elec_per_capita:
                      type: number
                    coal_electricity:
                      type: number
                    coal_prod_change_pct:
                      type: number
                    coal_prod_change_twh:
                      type: number
                    coal_prod_per_capita:
                      type: number
                    coal_production:
                      type: number
                    coal_share_elec:
                      type: number
                    coal_share_energy:
                      type: number
                    electricity_demand:
                      type: number
                    electricity_generation:
                      type: number
                    electricity_share_energy:
                      type: number
                    energy_cons_change_pct:
                      type: number
                    energy_cons_change_twh:
                      type: number
                    energy_per_capita:
                      type: number
                    energy_per_gdp:
                      type: number
              total_registros:
                type: integer
              sql_ejecutado:
                type: string
              sql_original:
                type: string
              metadata:
                type: object
                properties:
                  columnas:
                    type: array
                    items:
                      type: string
                  tipos_datos:
                    type: object

  /validar-sql:
    get:
      summary: ValidarSQL
      operationId: ValidarSQL
      parameters:
        - name: sql
          in: query
          required: true
          type: string
          description: SQL a validar
        - name: mostrar_explicacion
          in: query
          required: false
          type: boolean
          description: Mostrar explicación detallada
      responses:
        200:
          description: Respuesta exitosa
          schema:
            type: object
            properties:
              sql_original:
                type: string
              es_valido:
                type: boolean
              mensaje_validacion:
                type: string
              sql_sanitizado:
                type: string
              explicacion:
                type: object
                properties:
                  palabras_detectadas:
                    type: array
                    items:
                      type: string
                  tabla_detectada:
                    type: boolean
                  limit_detectado:
                    type: boolean
                  columnas_mencionadas:
                    type: array
                    items:
                      type: string

  /test-conexion:
    get:
      summary: TestConexion
      operationId: TestConexion
      parameters: []
      responses:
        200:
          description: Respuesta exitosa
          schema:
            type: object
            properties:
              status:
                type: string
                enum:
                  - ok
                  - timeout
                  - error
              conexion:
                type: string
              error:
                type: string

definitions: {}
parameters: {}
responses: {}
securityDefinitions: {}
security: []
tags: []