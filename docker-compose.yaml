##################### Versión 3 ######################

services:
  postgres:
    image: postgres:15
    container_name: basf_postgres
    environment:
      POSTGRES_DB: basf_data
      POSTGRES_USER: basf_user
      POSTGRES_PASSWORD: basf_secure_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - basf_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basf_user -d basf_data"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build: .
    container_name: basf_api
    environment:
      DATABASE_URL: postgresql://basf_user:basf_secure_password_2024@postgres:5432/basf_data
      PYTHONPATH: /app
    volumes:
      - ./src/api/data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - basf_db
    restart: unless-stopped

networks:
  basf_db:
    driver: bridge

volumes:
  postgres_data: